<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#F8F4F7">

    <title>To-Do | Student Toolkit</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="todo-page">

    <!-- Decorative background -->
    <div class="blob blob-pink"></div>
    <div class="blob blob-purple"></div>
    <div class="blob blob-blue"></div>


    <header class="todo-header">

        <div>

            <p class="todo-mini-title">
                ✦ STUDENT TOOLKIT
            </p>

            <h1>
                To-Do List
            </h1>

            <p class="todo-subtitle">
                Small steps. Big dreams. ♡
            </p>

        </div>


        <button
            class="todo-back"
            onclick="goHome()">

            ←

        </button>

    </header>


    <main class="todo-main">


        <!-- Progress -->

        <section class="progress-card">

            <div class="progress-top">

                <div>

                    <p class="progress-label">
                        ✦ Today's Progress
                    </p>

                    <h2 id="progressNumber">
                        0 / 0
                    </h2>

                </div>

                <div class="progress-doodle">
                    ♡
                </div>

            </div>


            <div class="progress-track">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>

        </section>


        <!-- Add task -->

        <section class="add-task-card">

            <div class="plus-circle">
                +
            </div>

            <input
                type="text"
                id="taskInput"
                placeholder="Add a new task..."
                autocomplete="off"
            >

            <button
                class="add-task-btn"
                onclick="addTask()">

                Add

            </button>

        </section>


        <!-- Filters -->

        <div class="todo-filters">

            <button
                class="filter active"
                onclick="setFilter('all', this)">

                All

            </button>

            <button
                class="filter"
                onclick="setFilter('pending', this)">

                To Do

            </button>

            <button
                class="filter"
                onclick="setFilter('completed', this)">

                Done

            </button>

        </div>


        <!-- Tasks -->

        <section
            id="taskList"
            class="task-list">
        </section>


        <!-- Empty state -->

        <div
            id="emptyState"
            class="empty-state">

            <div class="empty-icon">
                ✦
            </div>

            <h3>
                Nothing here yet
            </h3>

            <p>
                Add a task and let's get things done.
            </p>

        </div>


    </main>


    <button
        class="floating-add"
        onclick="focusTaskInput()">

        +

    </button>


    <footer class="todo-footer">

        Student Toolkit · Made for students ♡

    </footer>


    <script src="todo.js"></script>

</body>

</html>
