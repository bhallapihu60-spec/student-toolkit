<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List | Student Toolkit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div>
            <p class="eyebrow">STUDENT TOOLKIT</p>
            <h1>To-Do List</h1>
            <p class="subtitle">Stay organized. Get things done.</p>
        </div>

        <button class="back-btn" onclick="goHome()">
            ←
        </button>

    </header>


    <main>

        <section class="todo-box">

            <div class="todo-input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                >

                <button onclick="addTask()">
                    Add
                </button>

            </div>


            <div class="todo-info">

                <span id="taskCount">
                    0 tasks
                </span>

                <button
                    class="clear-btn"
                    onclick="clearCompleted()">
                    Clear completed
                </button>

            </div>


            <ul id="taskList"></ul>

        </section>

    </main>


    <footer>
        <p>Student Toolkit · Made for students</p>
    </footer>


    <script src="todo.js"></script>

</body>

</html>
