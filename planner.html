<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#F8F7F4">

    <title>Study Planner | Student Toolkit</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="planner-page">


    <!-- Decorative background -->

    <div class="planner-blob planner-pink"></div>
    <div class="planner-blob planner-purple"></div>
    <div class="planner-blob planner-blue"></div>


    <!-- Header -->

    <header class="planner-header">

        <div>

            <p class="planner-mini-title">
                ✦ STUDENT TOOLKIT
            </p>

            <h1>
                Study Planner
            </h1>

            <p class="planner-subtitle">
                Plan your day. Focus on what matters. ♡
            </p>

        </div>


        <button
            class="planner-back"
            onclick="goHome()">

            ←

        </button>

    </header>



    <main class="planner-main">


        <!-- Today's plan -->

        <section class="planner-card">

            <div class="planner-card-top">

                <div>

                    <p class="planner-label">
                        ✦ TODAY'S PLAN
                    </p>

                    <h2>
                        What are you studying?
                    </h2>

                </div>

                <div class="planner-star">
                    ✦
                </div>

            </div>


            <input
                type="text"
                id="subjectInput"
                class="planner-input"
                placeholder="e.g. Mathematics"
                autocomplete="off"
            >


            <input
                type="text"
                id="topicInput"
                class="planner-input"
                placeholder="e.g. Exponents and Powers"
                autocomplete="off"
            >


            <button
                class="planner-add-btn"
                onclick="addStudyTask()">

                + Add Study Session

            </button>

        </section>



        <!-- Study sessions -->

        <section class="sessions-section">

            <div class="sessions-heading">

                <div>

                    <p class="planner-label">
                        YOUR SESSIONS
                    </p>

                    <h2>
                        Study Schedule
                    </h2>

                </div>

                <span id="sessionCount">
                    0 sessions
                </span>

            </div>


            <div
                id="studySessions"
                class="study-sessions">
            </div>


            <div
                id="plannerEmpty"
                class="planner-empty">

                <div class="planner-empty-icon">
                    ♡
                </div>

                <h3>
                    Your study plan is empty
                </h3>

                <p>
                    Add your first study session above.
                </p>

            </div>

        </section>


    </main>



    <footer class="planner-footer">

        Student Toolkit · Made for students ♡

    </footer>



    <script src="planner.js"></script>

</body>

</html>
