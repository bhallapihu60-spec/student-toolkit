<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#F8F4F7">

    <title>Study Planner | Student Toolkit</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="planner-page">

    <!-- Decorative background -->

    <div class="planner-blob planner-pink"></div>

    <div class="planner-blob planner-purple"></div>

    <div class="planner-blob planner-blue"></div>


    <!-- HEADER -->

    <header class="planner-header">

        <div>

            <p class="planner-mini-title">
                ✦ STUDENT TOOLKIT
            </p>

            <h1>
                Study Planner
            </h1>

            <p class="planner-subtitle">
                Plan gently. Study smart. ♡
            </p>

        </div>


        <button
            class="planner-back"
            onclick="goHome()">

            ←

        </button>

    </header>


    <main class="planner-main">


        <!-- TODAY -->

        <section class="today-card">

            <div>

                <p class="today-small">
                    TODAY
                </p>

                <h2 id="todayDate">
                    Loading...
                </h2>

            </div>


            <div class="calendar-icon">
                ♡
            </div>

        </section>


        <!-- ADD SESSION -->

        <section class="planner-form">

            <div class="form-title">

                <span class="form-star">
                    ✦
                </span>

                <div>

                    <h2>
                        Plan a study session
                    </h2>

                    <p>
                        What are you working on today?
                    </p>

                </div>

            </div>


            <!-- SUBJECT -->

            <div class="input-group">

                <label>
                    SUBJECT
                </label>

                <input
                    type="text"
                    id="subjectInput"
                    placeholder="e.g. Mathematics"
                    autocomplete="off"
                >

            </div>


            <!-- TOPIC -->

            <div class="input-group">

                <label>
                    TOPIC
                </label>

                <input
                    type="text"
                    id="topicInput"
                    placeholder="e.g. Algebra"
                    autocomplete="off"
                >

            </div>


            <!-- TIME -->

            <div class="form-row">

                <div class="input-group">

                    <label>
                        START TIME
                    </label>

                    <input
                        type="time"
                        id="timeInput"
                    >

                </div>


                <div class="input-group">

                    <label>
                        DURATION
                    </label>

                    <select id="durationInput">

                        <option value="30">
                            30 min
                        </option>

                        <option value="45">
                            45 min
                        </option>

                        <option value="60" selected>
                            1 hour
                        </option>

                        <option value="90">
                            1.5 hours
                        </option>

                        <option value="120">
                            2 hours
                        </option>

                    </select>

                </div>

            </div>


            <!-- PRIORITY -->

            <div class="input-group">

                <label>
                    PRIORITY
                </label>


                <div class="priority-options">

                    <button
                        type="button"
                        class="priority active"
                        data-priority="Important"
                        onclick="selectPriority(this)">

                        <span></span>

                        Important

                    </button>


                    <button
                        type="button"
                        class="priority"
                        data-priority="Normal"
                        onclick="selectPriority(this)">

                        <span></span>

                        Normal

                    </button>


                    <button
                        type="button"
                        class="priority"
                        data-priority="Low"
                        onclick="selectPriority(this)">

                        <span></span>

                        Low

                    </button>

                </div>

            </div>


            <!-- ADD -->

            <button
                class="create-session-btn"
                onclick="addSession()">

                <span>
                    +
                </span>

                Add Study Session

            </button>

        </section>


        <!-- PLANNED SESSIONS -->

        <section class="sessions-section">

            <div class="sessions-heading">

                <div>

                    <p class="planner-label">
                        YOUR DAY
                    </p>

                    <h2>
                        Study Sessions
                    </h2>

                </div>


                <span
                    id="sessionCount"
                    class="session-count">

                    0

                </span>

            </div>


            <div
                id="sessionList"
                class="session-list">
            </div>


            <!-- EMPTY -->

            <div
                id="plannerEmpty"
                class="planner-empty">

                <div class="planner-empty-icon">
                    ✦
                </div>

                <h3>
                    Your day is waiting
                </h3>

                <p>
                    Add your first study session above.
                </p>

            </div>

        </section>


    </main>


    <footer class="planner-footer">

        Student Toolkit · Made for students ♡

    </footer>


    <script src="planner.js"></script>

</body>

</html>
