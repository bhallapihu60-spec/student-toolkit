<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Toolkit</title>

    <meta name="theme-color" content="#F8F7F4">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div>
            <p class="eyebrow">YOUR STUDY SPACE</p>

            <h1>Student Toolkit</h1>

            <p class="subtitle">
                Learn. Organize. Achieve.
            </p>
        </div>

        <button
    class="theme-btn"
    aria-label="Toggle night theme"
    onclick="
        document.body.classList.toggle('dark');
        localStorage.setItem(
            'studentTheme',
            document.body.classList.contains('dark') ? 'dark' : 'light'
        );
    "
>
    ☼
</button>

    </header>


    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="hero-label">WELCOME BACK</p>

                <h2>
                    Everything you need<br>
                    to stay on track.
                </h2>

                <p>
                    A simple, beautiful space for your
                    studies, tasks, notes and goals.
                </p>

            </div>

            <div class="hero-shape">
                ✦
            </div>

        </section>


        <div class="section-heading">

            <div>
                <p class="eyebrow">EXPLORE</p>
                <h2>Your Tools</h2>
            </div>

        </div>


        <section class="tools-grid">

            <button class="tool-card lavender"
                onclick="openTool('planner')">

                <span class="tool-icon">✦</span>

                <h3>Study Planner</h3>

                <p>
                    Plan your study sessions
                    and stay organized.
                </p>

                <span class="arrow">→</span>

            </button>


            <button class="tool-card rose"
                onclick="window.location.href='todo.html'">

                <span class="tool-icon">✓</span>

                <h3>To-Do List</h3>

                <p>
                    Keep track of everything
                    you need to finish.
                </p>

                <span class="arrow">→</span>

            </button>


            <button class="tool-card blue"
                onclick="openTool('timer')">

                <span class="tool-icon">◷</span>

                <h3>Focus Timer</h3>

                <p>
                    Work with focus and
                    take better breaks.
                </p>

                <span class="arrow">→</span>

            </button>


            <button class="tool-card champagne"
                onclick="openTool('notes')">

                <span class="tool-icon">✎</span>

                <h3>Notes</h3>

                <p>
                    Save your ideas,
                    reminders and notes.
                </p>

                <span class="arrow">→</span>

            </button>


            <button class="tool-card blue"
                onclick="openTool('calculator')">

                <span class="tool-icon">＋</span>

                <h3>Calculator</h3>

                <p>
                    Quickly solve your
                    everyday calculations.
                </p>

                <span class="arrow">→</span>

            </button>


            <button class="tool-card lavender"
                onclick="openTool('progress')">

                <span class="tool-icon">↗</span>

                <h3>Progress</h3>

                <p>
                    See your progress and
                    celebrate your wins.
                </p>

                <span class="arrow">→</span>

            </button>

        </section>

    </main>


    <footer>
        <p>Student Toolkit · Made for students</p>
    </footer>


    <script src="script.js"></script>
<script>
    if (localStorage.getItem("studentTheme") === "dark") {
        document.body.classList.add("dark");
    }
</script>

</body>

</html>
